<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 场景 - 荒漠迷城</title>
  <style>
    body { margin: 0; overflow: hidden; background: #c5ccc8; }
    canvas { display: block; }
    #info {
      display: none;
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 14px;
      border-radius: 8px;
      pointer-events: none;
      user-select: none;
      box-sizing: border-box;
      max-width: calc(100vw - 272px);
    }
    #home {
      position: absolute;
      top: 12px;
      right: 12px;
      color: #fff;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="info">
    敞开的绿篷棚子，地面中心有红色 <b>B</b>。东边沙黄楼是小卖部，可从拱门进入<br />
    <b>WASD</b>：相对视角移动（Shift 加速）&nbsp;|&nbsp;<b>方向键</b>：固定方向<br />
    <b>空格</b>：跳跃 &nbsp;|&nbsp; <b>V</b>：第一人称 &nbsp;|&nbsp; <b>鼠标拖拽</b>：第三人称旋转 &nbsp;|&nbsp; <b>滚轮</b>：缩放<br />
    第一人称：<b>1</b> 步枪（按住连发，30 发），<b>2</b> 手枪（单点，12 发），<b>3</b> 匕首（挥砍）。<b>左键</b>使用，<b>R</b> 换弹。再按 V 返回。Esc 释放鼠标
  </div>
  <a id="home" href="/">返回目录</a>
  <script type="module" src="./main.js"></script>
</body>
</html>
