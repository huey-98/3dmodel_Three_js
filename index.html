<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 场景 - 三层楼房</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 14px;
      border-radius: 8px;
      pointer-events: none;
      user-select: none;
    }
    #prompt {
      display: none;
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="info">
    <b>WASD</b>：相对视角移动（Shift 加速）&nbsp;|&nbsp;<b>方向键</b>：固定方向<br />
    <b>空格</b>：跳跃 &nbsp;|&nbsp; <b>F</b>：开门 &nbsp;|&nbsp; <b>G</b>：进入房间<br />
    <b>鼠标拖拽</b>：旋转视角 &nbsp;|&nbsp; <b>滚轮</b>：缩放 &nbsp;|&nbsp; 楼层：<span id="floor">1F</span>
  </div>
  <div id="prompt"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
