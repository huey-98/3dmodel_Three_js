<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 场景</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11151c;
      --card: #1b2230;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f4f6fb;
      --muted: #9aa6b8;
      --accent: #7eb6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at top, #243044 0%, var(--bg) 55%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }
    p {
      margin: 0 0 32px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      padding: 20px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    a.card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    a.card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    #mode-mask {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6, 9, 14, 0.72);
      backdrop-filter: blur(3px);
      z-index: 20;
      padding: 24px;
    }
    #mode-mask.open { display: flex; }
    .mode-box {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 22px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .mode-box h2 {
      margin: 0 0 4px;
      font-size: 19px;
    }
    .mode-box p {
      margin: 0 0 18px;
      font-size: 13px;
      color: var(--muted);
    }
    .mode-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button.mode {
      display: block;
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: inherit;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    button.mode:hover {
      border-color: var(--accent);
      background: rgba(126, 182, 255, 0.08);
    }
    button.mode strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }
    button.mode span {
      display: block;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--muted);
    }
    .mode-cancel {
      margin-top: 14px;
      width: 100%;
      padding: 9px;
      background: none;
      border: 0;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .mode-cancel:hover { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>3D 场景</h1>
    <p>共用同一套 Three.js 依赖。新增场景时在 <code>src/scenes/</code> 下建文件夹即可。</p>
    <div class="grid">
      <a class="card" href="/src/scenes/villa/">
        <h2>豪华别墅</h2>
        <span>可进屋、上楼、划船的别墅外景与室内。</span>
      </a>
      <a class="card" href="/src/scenes/maid/">
        <h2>鲸尾女仆</h2>
        <span>根据设定图还原的角色模型，可旋转查看。</span>
      </a>
      <a class="card" href="/src/scenes/dust2/">
        <h2>炙热沙城</h2>
        <span>CS2 Dust2 可跑图：A 大 / 中路 / B 通三路，A 坑在 A 大东侧，开阔自杀位正对中门。</span>
      </a>
      <a class="card" href="/src/scenes/bazaar/" data-modes="bazaar">
        <h2>荒漠迷城</h2>
        <span>敞开的绿篷棚子、沙黄大地砖和周围旧楼，棚下地面有红色 B。</span>
      </a>
    </div>
  </main>
  <div id="mode-mask" role="dialog" aria-modal="true" aria-labelledby="mode-title">
    <div class="mode-box">
      <h2 id="mode-title">进入荒漠迷城</h2>
      <p>选择这次进入的方式，想换一种回到这里重选即可。</p>
      <div class="mode-options">
        <button class="mode" type="button" data-href="/src/scenes/bazaar/?mode=free">
          <strong>自由跑图</strong>
          <span>没有敌人，可以四处走动、试枪，熟悉街区和棚子。</span>
        </button>
        <button class="mode" type="button" data-href="/src/scenes/bazaar/?mode=game">
          <strong>游戏模式</strong>
          <span>波次防守：敌人从南北两侧进场，清光一波再来下一波。</span>
        </button>
      </div>
      <button class="mode-cancel" type="button" id="mode-cancel">取消</button>
    </div>
  </div>
  <script>
    (() => {
      const mask = document.getElementById('mode-mask');
      const cancel = document.getElementById('mode-cancel');
      let pendingHref = '';
      function close() {
        mask.classList.remove('open');
        pendingHref = '';
        cancel.focus();
      }
      for (const card of document.querySelectorAll('a.card[data-modes]')) {
        card.addEventListener('click', (event) => {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          pendingHref = card.getAttribute('href');
          mask.classList.add('open');
          mask.querySelector('button.mode').focus();
        });
      }
      for (const button of mask.querySelectorAll('button.mode')) {
        button.addEventListener('click', () => {
          window.location.href = button.dataset.href;
        });
      }
      cancel.addEventListener('click', close);
      mask.addEventListener('click', (event) => {
        if (event.target === mask) close();
      });
      addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && mask.classList.contains('open')) close();
      });
    })();
  </script>
</body>
</html>
