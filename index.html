<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 场景 - 三层楼房</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 14px;
      border-radius: 8px;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="info">
    <b>WASD / 方向键</b>：移动人物（Shift 加速）<br />
    <b>鼠标拖拽</b>：旋转视角 &nbsp;|&nbsp; <b>滚轮</b>：缩放
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
