<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 场景</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11151c;
      --card: #1b2230;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f4f6fb;
      --muted: #9aa6b8;
      --accent: #7eb6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(ellipse at top, #243044 0%, var(--bg) 55%),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }
    p {
      margin: 0 0 32px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    a.card {
      display: block;
      padding: 20px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    a.card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    a.card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>3D 场景</h1>
    <p>共用同一套 Three.js 依赖。新增场景时在 <code>src/scenes/</code> 下建文件夹即可。</p>
    <div class="grid">
      <a class="card" href="/src/scenes/villa/">
        <h2>豪华别墅</h2>
        <span>可进屋、上楼、划船的别墅外景与室内。</span>
      </a>
      <a class="card" href="/src/scenes/maid/">
        <h2>鲸尾女仆</h2>
        <span>根据设定图还原的角色模型，可旋转查看。</span>
      </a>
      <a class="card" href="/src/scenes/bazaar/">
        <h2>B 点街巷</h2>
        <span>敞开的绿篷棚子、石板路和周围旧楼，棚下地面有红色 X。</span>
      </a>
    </div>
  </main>
</body>
</html>
